<div id="jp-clock" style="position:fixed;top:8px;right:10px;background:#fff;border:1px solid #999;padding:4px 8px;font:14px monospace;z-index:9"></div>
<script>
(function(){var e=document.getElementById('jp-clock');function f(z,d){return new Intl.DateTimeFormat('sv-SE',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d)}function t(){var d=new Date();e.textContent='JP '+f('Asia/Tokyo',d)+' | UTC '+f('UTC',d)}t();setInterval(t,1000)})();
</script>
