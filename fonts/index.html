<h1>KDP DOS fonts</h1>
<p>Raw 8&times;16 VGA bitmap fonts: 256 glyphs, 16 bytes each, 4096 bytes per file.</p>
<ul>
  <li><a href="MAIN437.FNT" download>MAIN437.FNT</a> &ndash; code page 437</li>
  <li><a href="MAIN850.FNT" download>MAIN850.FNT</a> &ndash; code page 850</li>
  <li><a href="MAIN.FNT" download>MAIN.FNT</a> &ndash; same as MAIN437.FNT</li>
  <li><a href="cp.py" download>cp.py</a> &ndash; the script that builds them (<code>python3 cp.py</code>)</li>
</ul>
<p>Linux console: <code>setfont MAIN437.FNT</code></p>
